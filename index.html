  </style>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Inline SVG Icons to avoid external dependency issues

        ),
        info: (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <circle cx="12" cy="12" r="10"></circle>

      return icons[name] || null;
    };

    // High-contrast, kid-friendly SVG sample illustrations encoded as Data URLs

      if (type === 'dino') {

          <polygon points="220,380 150,450 220,440" fill="#EF4444" stroke="#0F172A" stroke-width="8"/>

          <path d="M220 440 L220 240 Q220 120 300 80 Q380 120 380 240 L380 440 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="10"/>
          <path d="M242 160 Q300 100 358 160 Z" fill="#EF4444" stroke="#0F172A" stroke-width="8"/>
          <circle cx="300" cy="260" r="46" fill="#38BDF8" stroke="#0F172A" stroke-width="10"/>
          <circle cx="285" cy="245" r="12" fill="#FFFFFF" opacity="0.8"/>

      } else if (type === 'cake') {
        content = `
          <rect width="600" height="600" fill="#FEF3C7"/>
          <ellipse cx="300" cy="495" rx="220" ry="35" fill="#E2E8F0" stroke="#0F172A" stroke-width="8"/>
          <rect x="130" y="340" width="340" height="145" rx="20" fill="#F472B6" stroke="#0F172A" stroke-width="10"/>
          <path d="M130 370 Q172 415 215 370 Q257 415 300 370 Q342 415 385 370 Q427 415 470 370 L470 340 L130 340 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="8"/>

      } else {

          <circle cx="430" cy="180" r="65" fill="#F59E0B" stroke="#0F172A" stroke-width="10"/>
          <circle cx="170" cy="180" r="35" fill="#FDE68A"/>
          <circle cx="430" cy="180" r="35" fill="#FDE68A"/>
          <circle cx="300" cy="320" r="175" fill="#F59E0B" stroke="#0F172A" stroke-width="12"/>
          <ellipse cx="300" cy="365" rx="75" ry="60" fill="#FEF3C7" stroke="#0F172A" stroke-width="8"/>
          <circle cx="235" cy="285" r="18" fill="#0F172A"/>
          <circle cx="365" cy="285" r="18" fill="#0F172A"/>
          <circle cx="240" cy="279" r="6" fill="#FFFFFF"/>
          <circle cx="370" cy="279" r="6" fill="#FFFFFF"/>
          <ellipse cx="300" cy="340" rx="26" ry="18" fill="#0F172A"/>
          <path d="M300 358 L300 385 M270 385 Q300 410 330 385" fill="none" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>

      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">${content}</svg>`;
      return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
    };

    const SAMPLE_IMAGES = [
      { id: 'dino', label: '웃는 공룡', url: createSampleSVG('dino') },
      { id: 'rocket', label: '우주 로켓', url: createSampleSVG('rocket') },
      { id: 'cake', label: '생일 케이크', url: createSampleSVG('cake') },
      { id: 'bear', label: '귀여운 곰돌이', url: createSampleSVG('bear') },
    ];

    const GRID_PRESETS = [
      { label: '3×3 (9칸)', rows: 3, cols: 3, recLayout: '1page' },
      { label: '3×4 (12칸)', rows: 3, cols: 4, recLayout: '1page' },
      { label: '3×5 (15칸)', rows: 3, cols: 5, recLayout: '1page' },
      { label: '4×4 (16칸)', rows: 4, cols: 4, recLayout: '2page' },
      { label: '5×5 (25칸)', rows: 5, cols: 5, recLayout: '2page' },
      { label: '6×6 (36칸)', rows: 6, cols: 6, recLayout: '2page' },
    ];

    const ALL_DAN = [2, 3, 4, 5, 6, 7, 8, 9];

    const HINT_SYMBOLS = [
      { symbol: '★', color: '#DC2626' },
      { symbol: '●', color: '#2563EB' },
      { symbol: '▲', color: '#16A34A' },
      { symbol: '◆', color: '#9333EA' },
      { symbol: '♥', color: '#EA580C' },
      { symbol: '■', color: '#0891B2' },
    ];

    function App() {
      // 1. Grid & Print Layout State
      const [rows, setRows] = useState(3);
      const [cols, setCols] = useState(5);
      const [printMode, setPrintMode] = useState('1page'); // '1page' (Landscape 2-col) | '2page' (Portrait separate)

      // 2. Image State
      const [imageSourceType, setImageSourceType] = useState('sample'); // 'sample' | 'upload' | 'ai'
      const [selectedSampleId, setSelectedSampleId] = useState('dino');
      const [customImageUrl, setCustomImageUrl] = useState(null);
      const [aiPrompt, setAiPrompt] = useState('무지개와 웃고 있는 강아지');
      const [isGeneratingAi, setIsGeneratingAi] = useState(false);

      // 3. Math Settings State
      const [operations, setOperations] = useState({
        add: true,
        sub: true,
        mul: false,
        div: false,
      });
      const [difficulty, setDifficulty] = useState('easy'); // 'easy' (1-digit) | 'medium' (2-digit no carry) | 'hard' (2-digit with carry)
      const [selectedDans, setSelectedDans] = useState([2, 3, 4, 5, 6, 7, 8, 9]);
      const [preventDuplicates, setPreventDuplicates] = useState(true);
      const [useDuplicateBadges, setUseDuplicateBadges] = useState(true);

      // 4. Special Ed Visual & Motor Aids (ON/OFF toggles)
      const [aids, setAids] = useState({
        cutMargin: true,
        upArrow: true,
        underline69: true,
        highContrast: true,
      });

      // Worksheet Header Info
      const [worksheetTitle, setWorksheetTitle] = useState('사칙연산 그림 퍼즐 맞추기');

      // Generated Data State
      const [problems, setProblems] = useState([]);
      const [shuffledPieces, setShuffledPieces] = useState([]);
      const [slicedImages, setSlicedImages] = useState([]);

      const fileInputRef = useRef(null);

      // Dynamic Pixel Guide Calculation
      const recWidthPx = cols * 300;
      const recHeightPx = rows * 300;
      const gcd = (a, b) => (b === 0 ? a : gcd(b, a % b));
      const divisor = gcd(cols, rows);
      const aspectW = cols / divisor;
      const aspectH = rows / divisor;

      // Active Image URL
      const activeImageUrl =
        imageSourceType === 'sample'
          ? SAMPLE_IMAGES.find((s) => s.id === selectedSampleId)?.url
          : customImageUrl || SAMPLE_IMAGES[0].url;

      // Toggle Operation
      const toggleOp = (opKey) => {
        setOperations((prev) => {
          const next = { ...prev, [opKey]: !prev[opKey] };
          if (!next.add && !next.sub && !next.mul && !next.div) {
            return prev;
          }
          return next;
        });
      };

      // Toggle Dan (2~9)
      const toggleDan = (dan) => {
        setSelectedDans((prev) => {
          if (prev.includes(dan)) {
            if (prev.length === 1) return prev;
            return prev.filter((d) => d !== dan);
          }
          return [...prev, dan].sort((a, b) => a - b);
        });
      };

      // Generate Math Problems
      const generateProblems = () => {
        const totalCells = rows * cols;
        const activeOps = Object.keys(operations).filter((k) => operations[k]);
        const activeDanPool = selectedDans.length > 0 ? selectedDans : [2];
        const generated = [];
        const usedAnswers = new Set();

        for (let i = 0; i < totalCells; i++) {
          let expr = '';
          let ans = 0;
          let attempts = 0;

          while (attempts < 150) {
            attempts++;
            const op = activeOps[Math.floor(Math.random() * activeOps.length)];

            if (op === 'add') {
              if (difficulty === 'easy') {
                const a = Math.floor(Math.random() * 9) + 1;
                const b = Math.floor(Math.random() * 9) + 1;
                ans = a + b;
                expr = `${a} + ${b}`;
              } else if (difficulty === 'medium') {
                const a1 = Math.floor(Math.random() * 8) + 1;
                const a0 = Math.floor(Math.random() * 8) + 1;
                const b0 = Math.floor(Math.random() * (9 - a0)) + 1;
                const a = a1 * 10 + a0;
                ans = a + b0;
                expr = `${a} + ${b0}`;
              } else {
                const a = Math.floor(Math.random() * 40) + 12;
                const b = Math.floor(Math.random() * 35) + 9;
                ans = a + b;
                expr = `${a} + ${b}`;
              }
            } else if (op === 'sub') {
              if (difficulty === 'easy') {
                const b = Math.floor(Math.random() * 8) + 1;
                const ansVal = Math.floor(Math.random() * 9) + 1;
                const a = b + ansVal;
                ans = ansVal;
                expr = `${a} - ${b}`;
              } else if (difficulty === 'medium') {
                const a1 = Math.floor(Math.random() * 8) + 1;
                const a0 = Math.floor(Math.random() * 8) + 2;
                const b0 = Math.floor(Math.random() * (a0 - 1)) + 1;
                const a = a1 * 10 + a0;
                ans = a - b0;
                expr = `${a} - ${b0}`;
              } else {
                const a = Math.floor(Math.random() * 50) + 30;
                const b = Math.floor(Math.random() * 25) + 7;
                ans = a - b;
                expr = `${a} - ${b}`;
              }
            } else if (op === 'mul') {
              const dan = activeDanPool[Math.floor(Math.random() * activeDanPool.length)];
              const b = Math.floor(Math.random() * 9) + 1;
              ans = dan * b;
              expr = `${dan} × ${b}`;
            } else if (op === 'div') {
              const divisorVal = activeDanPool[Math.floor(Math.random() * activeDanPool.length)];
              const quotient = Math.floor(Math.random() * 9) + 1;
              const dividend = divisorVal * quotient;
              ans = quotient;
              expr = `${dividend} ÷ ${divisorVal}`;
            }

            if (!preventDuplicates || !usedAnswers.has(ans)) {
              usedAnswers.add(ans);
              break;
            }
          }

          generated.push({
            id: i,
            row: Math.floor(i / cols),
            col: i % cols,
            expr,
            ans,
            hintBadge: null,
          });
        }

        // Assign duplicate hint badges if duplicates still exist
        const answerCounts = {};
        generated.forEach((p) => {
          answerCounts[p.ans] = (answerCounts[p.ans] || 0) + 1;
        });

        const answerOccurrence = {};
        generated.forEach((p) => {
          if (answerCounts[p.ans] > 1 && useDuplicateBadges) {
            const idx = answerOccurrence[p.ans] || 0;
            answerOccurrence[p.ans] = idx + 1;
            p.hintBadge = HINT_SYMBOLS[idx % HINT_SYMBOLS.length];
          }
        });

        setProblems(generated);

        // Shuffle pieces ensuring it's not already solved
        const indices = generated.map((_, idx) => idx);
        for (let i = indices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [indices[i], indices[j]] = [indices[j], indices[i]];
        }
        setShuffledPieces(indices.map((origIdx) => generated[origIdx]));
      };

      // Slice Image with Canvas API (Auto Center-Crop Cover)
      useEffect(() => {
        if (!activeImageUrl) return;
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          const targetAspect = cols / rows;
          const imgAspect = img.width / img.height;

          let sx = 0,
            sy = 0,
            sWidth = img.width,
            sHeight = img.height;

          if (imgAspect > targetAspect) {
            sWidth = img.height * targetAspect;
            sx = (img.width - sWidth) / 2;
          } else {
            sHeight = img.width / targetAspect;
            sy = (img.height - sHeight) / 2;
          }

          const pieceW = sWidth / cols;
          const pieceH = sHeight / rows;
          const slices = [];

          const canvas = document.createElement('canvas');
          const outW = 300;
          const outH = Math.round(300 * (pieceH / pieceW));
          canvas.width = outW;
          canvas.height = outH;
          const ctx = canvas.getContext('2d');

          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              ctx.clearRect(0, 0, outW, outH);
              ctx.drawImage(
                img,
                sx + c * pieceW,
                sy + r * pieceH,
                pieceW,
                pieceH,
                0,
                0,
                outW,
                outH
              );
              slices.push(canvas.toDataURL('image/png'));
            }
          }
          setSlicedImages(slices);
        };
        img.src = activeImageUrl;
      }, [activeImageUrl, rows, cols]);

      // Regenerate math whenever grid or math settings change
      useEffect(() => {
        generateProblems();
      }, [rows, cols, operations, difficulty, selectedDans, preventDuplicates, useDuplicateBadges]);

      // Handle Custom File Upload
      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          setCustomImageUrl(event.target.result);
          setImageSourceType('upload');
        };
        reader.readAsDataURL(file);
      };

      // Simulated AI Illustration Generator (Dynamic Canvas Illustration based on Keyword)
      const handleGenerateAiImage = () => {
        setIsGeneratingAi(true);
        setTimeout(() => {
          const canvas = document.createElement('canvas');
          canvas.width = 600;
          canvas.height = 600;
          const ctx = canvas.getContext('2d');

          const palettes = [
            ['#DBEAFE', '#3B82F6', '#FBBF24', '#EF4444'],
            ['#FCE7F3', '#EC4899', '#8B5CF6', '#10B981'],
            ['#FEF3C7', '#F59E0B', '#06B6D4', '#F43F5E'],
            ['#DCFCE7', '#22C55E', '#F97316', '#6366F1'],
          ];
          const hash = aiPrompt.split('').reduce((acc, ch) => acc + ch.charCodeAt(0), 0);
          const pal = palettes[hash % palettes.length];

          ctx.fillStyle = pal[0];
          ctx.fillRect(0, 0, 600, 600);

          // Decorative shapes
          ctx.lineWidth = 8;
          ctx.strokeStyle = '#0F172A';

          // Rainbow / Arch
          ctx.beginPath();
          ctx.arc(300, 460, 220, Math.PI, 0);
          ctx.strokeStyle = pal[3];
          ctx.lineWidth = 28;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(300, 460, 185, Math.PI, 0);
          ctx.strokeStyle = pal[2];
          ctx.lineWidth = 28;
          ctx.stroke();

          // Cute Character Circle
          ctx.fillStyle = '#FFFFFF';
          ctx.strokeStyle = '#0F172A';
          ctx.lineWidth = 10;
          ctx.beginPath();
          ctx.arc(300, 320, 130, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Ears
          ctx.fillStyle = pal[1];
          ctx.beginPath();
          ctx.arc(205, 215, 42, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(395, 215, 42, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Eyes & Smile
          ctx.fillStyle = '#0F172A';
          ctx.beginPath();
          ctx.arc(255, 300, 14, 0, Math.PI * 2);
          ctx.arc(345, 300, 14, 0, Math.PI * 2);
          ctx.fill();

          ctx.beginPath();
          ctx.arc(300, 330, 40, 0.1 * Math.PI, 0.9 * Math.PI);
          ctx.lineWidth = 8;
          ctx.stroke();

          // Keyword Label Banner
          ctx.fillStyle = '#FFFFFF';
          ctx.strokeStyle = '#0F172A';
          ctx.lineWidth = 6;
          ctx.fillRect(110, 490, 380, 64);
          ctx.strokeRect(110, 490, 380, 64);

          ctx.fillStyle = '#0F172A';
          ctx.font = 'bold 28px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const shortTitle = aiPrompt.slice(0, 14) || 'AI 생성 그림';
          ctx.fillText(shortTitle, 300, 522);

          setCustomImageUrl(canvas.toDataURL('image/png'));
          setImageSourceType('ai');
          setIsGeneratingAi(false);
        }, 450);
      };

      // Calculate exact physical dimensions in mm so problem cell === puzzle piece
      const getPhysicalDimensions = () => {
        if (printMode === '1page') {
          // A4 Landscape: 297mm x 210mm
          // Available area per column: ~122mm wide x ~132mm high
          const maxGridW = 122;
          const maxGridH = 132;
          const cellSize = Math.floor(Math.min(maxGridW / cols, maxGridH / rows) * 10) / 10;
          return {
            cellW: cellSize,
            cellH: cellSize,
            gridW: cellSize * cols,
            gridH: cellSize * rows,
          };
        } else {
          // A4 Portrait: 210mm x 297mm
          // Available area per page: ~174mm wide x ~210mm high
          const maxGridW = 174;
          const maxGridH = 210;
          const cellSize = Math.floor(Math.min(maxGridW / cols, maxGridH / rows) * 10) / 10;
          return {
            cellW: cellSize,
            cellH: cellSize,
            gridW: cellSize * cols,
            gridH: cellSize * rows,
          };
        }
      };

      const dims = getPhysicalDimensions();

      // Dynamic font sizes based on cell size & high-contrast aid
      const getProblemFontSize = () => {
        const base = Math.min(dims.cellW, dims.cellH) * 0.34;
        return aids.highContrast ? Math.max(13, Math.round(base * 1.12)) : Math.max(11, Math.round(base));
      };

      // Check if number needs 6/9 underline
      const needsUnderline = (num) => {
        if (!aids.underline69) return false;
        const str = String(num);
        return str.includes('6') || str.includes('9');
      };

      // Render Problem Board Component
      const renderProblemGrid = () => (
        <div className="flex flex-col items-center">
          <div className="mb-1.5 flex items-center gap-1.5 text-xs font-bold text-slate-700">
            <span className="inline-block w-2.5 h-2.5 rounded-full bg-indigo-600"></span>
            <span>[문제판] 알맞은 답의 그림 조각을 오려서 붙이세요</span>
          </div>
          <div
            style={{
              display: 'grid',
              gridTemplateColumns: `repeat(${cols}, ${dims.cellW}mm)`,
              gridTemplateRows: `repeat(${rows}, ${dims.cellH}mm)`,
              width: `${dims.gridW}mm`,
              height: `${dims.gridH}mm`,
            }}
            className={`bg-white ${
              aids.highContrast ? 'border-[2.5px] border-slate-900' : 'border border-slate-500'
            }`}
          >
            {problems.map((p) => (
              <div
                key={p.id}
                style={{
                  width: `${dims.cellW}mm`,
                  height: `${dims.cellH}mm`,
                  fontSize: `${getProblemFontSize()}px`,
                }}
                className={`flex items-center justify-center text-center font-black tracking-tight select-none ${
                  aids.highContrast
                    ? 'border border-slate-900 text-black'
                    : 'border border-slate-400 text-slate-800'
                }`}
              >
                <span className="leading-none px-0.5">{p.expr}</span>
              </div>
            ))}
          </div>
        </div>
      );

      // Render Shuffled Puzzle Pieces Component
      const renderPuzzlePiecesGrid = () => {
        const gapMm = aids.cutMargin ? 2.5 : 0;
        const totalPiecesW = dims.cellW * cols + gapMm * (cols - 1);
        const totalPiecesH = dims.cellH * rows + gapMm * (rows - 1);

        return (
          <div className="flex flex-col items-center">
            <div className="mb-1.5 flex items-center gap-1.5 text-xs font-bold text-slate-700">
              <Icon name="scissors" size={14} className="text-rose-600" />
              <span>[퍼즐 조각] 점선을 따라 자른 뒤 정답 칸에 붙이세요</span>
            </div>
            <div
              style={{
                display: 'grid',
                gridTemplateColumns: `repeat(${cols}, ${dims.cellW}mm)`,
                gridTemplateRows: `repeat(${rows}, ${dims.cellH}mm)`,
                gap: `${gapMm}mm`,
                width: `${totalPiecesW}mm`,
                height: `${totalPiecesH}mm`,
              }}
            >
              {shuffledPieces.map((piece, idx) => {
                const sliceUrl = slicedImages[piece.id];
                return (
                  <div
                    key={`${piece.id}-${idx}`}
                    style={{
                      width: `${dims.cellW}mm`,
                      height: `${dims.cellH}mm`,
                    }}
                    className={`relative overflow-hidden bg-slate-50 box-border ${
                      aids.cutMargin
                        ? 'border-2 border-dashed border-slate-800'
                        : 'border border-dashed border-slate-500'
                    }`}
                  >
                    {sliceUrl && (
                      <img
                        src={sliceUrl}
                        alt=""
                        className="w-full h-full object-cover block"
                      />
                    )}

                    {/* Top-Left Answer Badge (Minimizes covering main illustration) */}
                    <div
                      className={`absolute top-1 left-1 flex items-center justify-center rounded px-1.5 py-0.5 leading-none font-black shadow-sm ${
                        aids.highContrast
                          ? 'bg-white text-black border-2 border-black'
                          : 'bg-white/90 text-slate-900 border border-slate-600'
                      }`}
                      style={{
                        fontSize: `${Math.max(10, Math.round(Math.min(dims.cellW, dims.cellH) * 0.24))}px`,
                      }}
                    >
                      {piece.hintBadge && (
                        <span
                          style={{ color: piece.hintBadge.color }}
                          className="mr-0.5 text-[0.85em]"
                        >
                          {piece.hintBadge.symbol}
                        </span>
                      )}
                      <span
                        className={
                          needsUnderline(piece.ans)
                            ? 'underline decoration-2 underline-offset-2'
                            : ''
                        }
                      >
                        {piece.ans}
                      </span>
                    </div>

                    {/* Top-Center Upward Direction Arrow Aid */}
                    {aids.upArrow && (
                      <div className="absolute top-0.5 left-1/2 -translate-x-1/2 bg-white/85 text-slate-900 rounded-full px-1 text-[9px] font-black leading-tight border border-slate-400">
                        ▲
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      };

      // Render Worksheet Header
      const renderWorksheetHeader = (subtitle = '') => (
        <div className="w-full border-b-2 border-slate-800 pb-2 mb-3 flex flex-wrap items-end justify-between gap-2">
          <div>
            <div className="flex items-center gap-2">
              <span className="bg-slate-800 text-white text-[10px] font-bold px-2 py-0.5 rounded">
                수학 · 인지 퍼즐 활동지 {subtitle && `(${subtitle})`}
              </span>
            </div>
            <h1 className="text-lg font-black text-slate-900 mt-1 tracking-tight">
              {worksheetTitle}
            </h1>
          </div>
          <div className="flex items-center gap-3 text-xs font-bold text-slate-800">
            <span>학년/반: _________</span>
            <span>이름: ____________</span>
            <span>날짜: ____. __. __.</span>
          </div>
        </div>
      );

      // Render Worksheet Footer
      const renderWorksheetFooter = () => (
        <div className="w-full border-t border-slate-400 pt-2 mt-auto flex items-center justify-between text-xs font-bold text-slate-700">
          <div>완성된 그림의 이름: ___________________________</div>
          <div className="flex items-center gap-2">
            <span>오늘 활동 기분:</span>
            <span className="border border-slate-400 rounded px-2 py-0.5">😀 재미있어요</span>

            <span className="border border-slate-400 rounded px-2 py-0.5">🤔 어려웠어요</span>

      return (

          {/* LEFT CONTROL SIDEBAR (Hidden on print) */}

                <h2 className="text-lg font-black text-slate-900">사칙연산 직소 퍼즐 생성기</h2>
              </div>
              <button

                className="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition"
              >
                <Icon name="refresh" size={18} />
              </button>
            </div>

            <div className="space-y-6">
              {/* SECTION 1: Grid & Print Mode */}
              <section className="space-y-3">
                <div className="flex items-center gap-1.5 text-sm font-extrabold text-slate-800">
                  <Icon name="grid" size={16} className="text-indigo-600" />
                  <h3>1. 그리드 크기 및 인쇄 방식</h3>
                </div>

                <div className="grid grid-cols-3 gap-1.5">
                  {GRID_PRESETS.map((preset) => {
                    const active = rows === preset.rows && cols === preset.cols;
                    return (
                      <button
                        key={preset.label}
                        onClick={() => {

                          setPrintMode(preset.recLayout);
                        }}
                        className={`py-2 px-2 rounded-lg text-xs font-bold border transition ${
                          active
                            ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
                            : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                        }`}
                      >
                        {preset.label}
                      </button>
                    );
                  })}
                </div>

                {/* Custom Rows/Cols */}
                <div className="flex items-center gap-3 bg-slate-50 p-2.5 rounded-lg border border-slate-200 text-xs">
                  <div className="flex-1 flex items-center justify-between">
                    <span className="font-bold text-slate-600">세로(행):</span>
                    <select
                      value={rows}
                      onChange={(e) => setRows(Number(e.target.value))}
                      className="border border-slate-300 rounded px-2 py-1 bg-white font-bold"
                    >
                      {[2, 3, 4, 5, 6].map((n) => (

                  </div>
                  <div className="flex-1 flex items-center justify-between">
                    <span className="font-bold text-slate-600">가로(열):</span>
                    <select
                      value={cols}
                      onChange={(e) => setCols(Number(e.target.value))}
                      className="border border-slate-300 rounded px-2 py-1 bg-white font-bold"
                    >
                      {[2, 3, 4, 5, 6].map((n) => (
                        <option key={n} value={n}>{n}칸</option>
                      ))}
                    </select>
                  </div>
                </div>

                {/* Print Layout Selector */}
                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={() => setPrintMode('1page')}
                    className={`p-2.5 rounded-lg border text-left transition ${
                      printMode === '1page'
                        ? 'bg-indigo-50 border-indigo-600 text-indigo-900'

                    }`}
                  >
                    <div className="text-xs font-extrabold">1페이지 (A4 가로 2단)</div>
                    <div className="text-[11px] opacity-80 mt-0.5">좌: 문제판 / 우: 조각판</div>
                  </button>
                  <button
                    onClick={() => setPrintMode('2page')}
                    className={`p-2.5 rounded-lg border text-left transition ${
                      printMode === '2page'
                        ? 'bg-indigo-50 border-indigo-600 text-indigo-900'
                        : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'
                    }`}
                  >
                    <div className="text-xs font-extrabold">2페이지 (A4 세로 분리)</div>
                    <div className="text-[11px] opacity-80 mt-0.5">4×4 이상 큰 그리드 권장</div>
                  </button>
                </div>

                <div className="text-[11px] text-slate-500 bg-slate-50 px-2.5 py-1.5 rounded border border-slate-200">
                  * 현재 1칸 물리 크기: <strong>{dims.cellW}mm × {dims.cellH}mm</strong> (문제판과 조각 1:1 일치)
                </div>
              </section>

              {/* SECTION 2: Image Selection & Pixel Guide */}
              <section className="space-y-3 border-t border-slate-200 pt-4">
                <div className="flex items-center gap-1.5 text-sm font-extrabold text-slate-800">
                  <Icon name="image" size={16} className="text-indigo-600" />
                  <h3>2. 퍼즐 그림 선택 및 생성</h3>
                </div>

                {/* Tabs */}
                <div className="flex rounded-lg bg-slate-100 p-1 text-xs font-bold">
                  <button
                    onClick={() => setImageSourceType('sample')}
                    className={`flex-1 py-1.5 rounded-md transition ${
                      imageSourceType === 'sample' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600'
                    }`}
                  >
                    기본 일러스트
                  </button>
                  <button
                    onClick={() => setImageSourceType('upload')}
                    className={`flex-1 py-1.5 rounded-md transition ${

                    }`}
                  >
                    사진 업로드
                  </button>
                  <button
                    onClick={() => setImageSourceType('ai')}
                    className={`flex-1 py-1.5 rounded-md transition ${

                {imageSourceType === 'sample' && (
                  <div className="grid grid-cols-4 gap-2">
                    {SAMPLE_IMAGES.map((sample) => (
                      <button
                        key={sample.id}

                        className={`p-1.5 rounded-lg border text-center transition ${
                          selectedSampleId === sample.id
                            ? 'border-indigo-600 bg-indigo-50 ring-2 ring-indigo-200'

                        <img

                          className="w-full aspect-square object-cover rounded mb-1"

                        <span className="text-[11px] font-bold text-slate-700 block truncate">
                          {sample.label}

                      </button>

                {imageSourceType === 'upload' && (
                  <div className="space-y-2">
                    <input
                      ref={fileInputRef}
                      type="file"
                      accept="image/*"
                      onChange={handleFileUpload}

                    />
                    <button
                      onClick={() => fileInputRef.current?.click()}
                      className="w-full py-3 px-4 border-2 border-dashed border-indigo-300 rounded-xl bg-indigo-50/50 hover:bg-indigo-50 text-indigo-700 text-xs font-bold flex flex-col items-center gap-1 transition"
                    >
                      <Icon name="upload" size={20} />
                      <span>클릭하여 내 컴퓨터에서 이미지 선택 (JPG, PNG)</span>
                    </button>
                  </div>
                )}

                {imageSourceType === 'ai' && (
                  <div className="space-y-2">
                    <div className="flex gap-1.5">
                      <input
                        type="text"
                        value={aiPrompt}
                        onChange={(e) => setAiPrompt(e.target.value)}
                        placeholder="예: 우주선 타는 고양이, 딸기 케이크"
                        className="flex-1 text-xs border border-slate-300 rounded-lg px-2.5 py-2 focus:outline-none focus:border-indigo-500"
                      />
                      <button
                        onClick={handleGenerateAiImage}
                        disabled={isGeneratingAi}
                        className="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-lg flex items-center gap-1 shrink-0"
                      >
                        <Icon name="sparkles" size={14} />
                        <span>{isGeneratingAi ? '생성중...' : '생성'}</span>
                      </button>
                    </div>
                    <p className="text-[11px] text-slate-500">
                      * 동화책 스타일의 선명한 외곽선 일러스트로 자동 변환됩니다.
                    </p>
                  </div>
                )}

                {/* Dynamic Pixel Guide Box */}
                <div className="bg-amber-50 border border-amber-200 rounded-lg p-2.5 flex items-start gap-2 text-[11px] text-amber-900">
                  <Icon name="info" size={15} className="text-amber-600 shrink-0 mt-0.5" />
                  <div>
                    <span className="font-bold">업로드 이미지 픽셀 가이드 ({rows}×{cols} 그리드):</span>
                    <div className="mt-0.5">
                      권장 해상도 <strong>{recWidthPx} × {recHeightPx} px</strong> (비율 {aspectW}:{aspectH}). 다른 비율의 사진도 중앙 기준으로 자동 맞춤 크롭됩니다.
                    </div>

              </section>

              {/* SECTION 3: Math Operations & Granular Gugudan */}
              <section className="space-y-3 border-t border-slate-200 pt-4">
                <div className="flex items-center gap-1.5 text-sm font-extrabold text-slate-800">
                  <Icon name="calc" size={16} className="text-indigo-600" />
                  <h3>3. 사칙연산 문제 설정</h3>
                </div>

                {/* Operation Multi-select */}
                <div className="grid grid-cols-4 gap-1.5">
                  {[
                    { key: 'add', label: '덧셈 (+)' },
                    { key: 'sub', label: '뺄셈 (-)' },
                    { key: 'mul', label: '곱셈 (×)' },
                    { key: 'div', label: '나눗셈 (÷)' },
                  ].map((op) => (
                    <button
                      key={op.key}
                      onClick={() => toggleOp(op.key)}
                      className={`py-2 rounded-lg text-xs font-extrabold border transition ${
                        operations[op.key]
                          ? 'bg-emerald-600 text-white border-emerald-600'
                          : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
                      }`}
                    >
                      {op.label}
                    </button>
                  ))}
                </div>

                {/* Granular 2~9 Dan Selector (shown when mul or div is active) */}
                {(operations.mul || operations.div) && (
                  <div className="bg-emerald-50/70 border border-emerald-200 rounded-lg p-2.5 space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-extrabold text-emerald-900">
                        구구단 범위 선택 (곱셈·나눗셈 연동)

                    <select
                      value={difficulty}
                      onChange={(e) => setDifficulty(e.target.value)}
                      className="w-full text-xs font-bold border border-slate-300 rounded-lg p-2 bg-white"
                    >
                      <option value="easy">기초: 한 자리 수 연산 (예: 4 + 3, 9 - 2)</option>
                      <option value="medium">중급: 두 자리 수 ± 한 자리 수 (받아올림/내림 없음)</option>
                      <option value="hard">심화: 두 자리 수 연산 (받아올림/내림 포함)</option>
                    </select>
                  </div>
                )}

                {/* Duplicate Answer Handling */}
                <div className="space-y-1.5 pt-1">
                  <label className="flex items-center justify-between text-xs font-bold text-slate-700 cursor-pointer">
                    <span>정답 숫자 중복 최대한 방지</span>
                    <input
                      type="checkbox"
                      checked={preventDuplicates}
                      onChange={(e) => setPreventDuplicates(e.target.checked)}
                      className="w-4 h-4 accent-indigo-600 rounded"
                    />
                  </label>
                  <label className="flex items-center justify-between text-xs font-bold text-slate-700 cursor-pointer">
                    <span>중복 정답 발생 시 도형 아이콘 힌트 표시 (★5, ●5)</span>
                    <input
                      type="checkbox"
                      checked={useDuplicateBadges}
                      onChange={(e) => setUseDuplicateBadges(e.target.checked)}
                      className="w-4 h-4 accent-indigo-600 rounded"
                    />
                  </label>
                </div>
              </section>

              {/* SECTION 4: Special Education Visual & Motor Aids */}
              <section className="space-y-2.5 border-t border-slate-200 pt-4">
                <div className="flex items-center gap-1.5 text-sm font-extrabold text-slate-800">
                  <Icon name="eye" size={16} className="text-indigo-600" />
                  <h3>4. 특수교육 시지각·소근육 보조 장치</h3>
                </div>

                {[
                  {
                    key: 'cutMargin',
                    title: '가위질 여백 모드 (점선 간격)',
                    desc: '조각 사이 2.5mm 간격과 굵은 점선 표시',
                  },
                  {
                    key: 'upArrow',
                    title: '상하 방향 화살표 (▲)',
                    desc: '조각 위쪽 중앙에 화살표를 넣어 거꾸로 붙임 방지',
                  },
                  {
                    key: 'underline69',
                    title: '숫자 6 · 9 밑줄 구분',
                    desc: '6과 9 혼동 방지를 위해 숫자 아래 굵은 밑줄 표시',
                  },
                  {
                    key: 'highContrast',
                    title: '고대비 테두리 및 큰 수식 글씨',
                    desc: '시지각 변별력을 높이는 굵은 검은 테두리 적용',
                  },
                ].map((item) => (
                  <label
                    key={item.key}
                    className="flex items-center justify-between p-2.5 rounded-lg border border-slate-200 bg-slate-50/70 hover:bg-slate-100/70 cursor-pointer transition"
                  >
                    <div className="pr-2">
                      <div className="text-xs font-extrabold text-slate-800">{item.title}</div>
                      <div className="text-[11px] text-slate-500">{item.desc}</div>
                    </div>
                    <input
                      type="checkbox"
                      checked={aids[item.key]}
                      onChange={(e) => setAids((prev) => ({ ...prev, [item.key]: e.target.checked }))}
                      className="w-4 h-4 accent-indigo-600 rounded shrink-0"
                    />
                  </label>
                ))}
              </section>

              {/* Title Input */}
              <section className="space-y-1.5 border-t border-slate-200 pt-4">
                <label className="text-xs font-extrabold text-slate-700 block">학습지 제목 수정</label>
                <input
                  type="text"
                  value={worksheetTitle}
                  onChange={(e) => setWorksheetTitle(e.target.value)}
                  className="w-full text-xs font-bold border border-slate-300 rounded-lg px-3 py-2"
                />
              </section>
            </div>
          </aside>

          {/* RIGHT MAIN PREVIEW & PRINT AREA */}
          <main className="flex-1 flex flex-col min-w-0">
            {/* Top Action Bar (Hidden on print) */}
            <header className="no-print bg-white border-b border-slate-200 px-6 py-3.5 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-10 shadow-xs">
              <div className="text-xs text-slate-600">
                현재 미리보기:{' '}
                <strong className="text-slate-900">
                  {printMode === '1page'
                    ? 'A4 가로 1페이지 (좌우 2단 분할)'
                    : 'A4 세로 2페이지 (1쪽 문제판 / 2쪽 퍼즐 조각)'}
                </strong>
              </div>
              <div className="flex items-center gap-2.5">
                <button
                  onClick={generateProblems}
                  className="px-3.5 py-2 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 text-xs font-bold flex items-center gap-1.5 transition"
                >
                  <Icon name="refresh" size={15} />
                  <span>문제·조각 새로고침</span>
                </button>
                <button
                  onClick={() => window.print()}
                  className="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-extrabold flex items-center gap-1.5 shadow-sm transition"
                >
                  <Icon name="printer" size={16} />
                  <span>A4 인쇄 / PDF 저장</span>
                </button>
              </div>
            </header>

            {/* Printable Worksheet Sheets Container */}
            <div
              id="print-area"
              className="flex-1 p-6 lg:p-8 overflow-auto flex flex-col items-center gap-8"
            >
              {printMode === '1page' ? (
                /* 1-PAGE LANDSCAPE SHEET (297mm x 210mm) */
                <div
                  style={{ width: '297mm', minHeight: '210mm', padding: '10mm 12mm' }}
                  className="a4-sheet bg-white shadow-lg border border-slate-300 flex flex-col justify-between box-border"
                >
                  {renderWorksheetHeader('1장 완성형')}

                  <div className="flex-1 flex items-center justify-around gap-6 my-auto py-2">
                    {renderProblemGrid()}
                    <div className="h-[145mm] border-l-2 border-dashed border-slate-300"></div>
                    {renderPuzzlePiecesGrid()}
                  </div>

                  {renderWorksheetFooter()}
                </div>
              ) : (
                /* 2-PAGE PORTRAIT SHEETS (210mm x 297mm each) */
                <>
                  {/* PAGE 1: PROBLEM BOARD */}
                  <div
                    style={{ width: '210mm', minHeight: '297mm', padding: '12mm 14mm' }}
                    className="a4-sheet bg-white shadow-lg border border-slate-300 flex flex-col justify-between box-border"
                  >
                    {renderWorksheetHeader('1쪽: 문제판')}
                    <div className="flex-1 flex items-center justify-center my-auto py-4">
                      {renderProblemGrid()}
                    </div>
                    {renderWorksheetFooter()}
                  </div>

                  {/* PAGE 2: PUZZLE PIECES */}
                  <div
                    style={{ width: '210mm', minHeight: '297mm', padding: '12mm 14mm' }}
                    className="a4-sheet bg-white shadow-lg border border-slate-300 flex flex-col justify-between box-border"
                  >
                    {renderWorksheetHeader('2쪽: 오릴 퍼즐 조각')}
                    <div className="flex-1 flex items-center justify-center my-auto py-4">
                      {renderPuzzlePiecesGrid()}
                    </div>
                    <div className="w-full border-t border-slate-400 pt-2 mt-auto text-center text-xs font-bold text-slate-600">
                      점선을 따라 조심스럽게 오린 뒤, 1쪽 문제판의 알맞은 정답 칸 위에 풀로 붙여 그림을 완성하세요.
                    </div>
                  </div>
                </>
              )}
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
